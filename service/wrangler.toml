name = "freeplay-tables"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "freeplay-tables"
database_id = "b71e8b8e-a914-41bd-bfe8-2c50b0110c93"

[triggers]
crons = ["*/5 * * * *"]

[vars]
TABLES_REPO = "antaresjay/freeplay-tables"
TABLES_BRANCH = "main"
# who the mirror commits are from. leave this alone and github will stamp them
# with whatever address the token's account uses
MIRROR_NAME = "freeplay"
MIRROR_EMAIL = "freeplay@users.noreply.github.com"
