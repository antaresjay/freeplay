name: ci

# by hand only. everything in here runs locally before a commit anyway, so
# firing it on every push burned an hour of windows minutes a day to tell us
# what we already knew. windows runners cost ten times a linux one.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # Freeplay reads another process's memory through Win32, so there is
    # nothing to gain from building it anywhere else yet.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # cargo reads a toml with a byte order mark on the front, the toml parser
      # inside tauri-action does not, and the build only fell over at bundling
      - name: No byte order marks
        shell: bash
        run: |
          found=$(git ls-files -z | xargs -0 -I{} sh -c \
            'test -f "{}" && head -c3 "{}" | grep -q "$(printf "\357\273\277")" && echo "{}"' || true)
          if [ -n "$found" ]; then echo "byte order mark in:"; echo "$found"; exit 1; fi

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Click through the interface
        run: python app/uitest/clickthrough.py

      - name: Click through the overlay
        run: python app/uitest/overlay.py

      # this one measures. it catches a panel sliding sideways by the width of
      # a scrollbar, which no assertion on a single number ever did
      - name: Measure the layout
        run: python app/uitest/layout.py

      - name: Build release
        run: cargo build --release --workspace
