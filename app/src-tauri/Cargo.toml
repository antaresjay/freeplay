[package]
name = "freeplay-app"
description = "Freeplay desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "freeplay-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
freeplay-core = { path = "../../crates/freeplay-core" }
freeplay-library = { path = "../../crates/freeplay-library" }
freeplay-session = { path = "../../crates/freeplay-session" }
freeplay-table = { path = "../../crates/freeplay-table" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tracing.workspace = true
tracing-subscriber = "0.3"
