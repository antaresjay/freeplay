[package]
name = "freeplay-app"
description = "Freeplay desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "freeplay-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
freeplay-aa = { path = "../../crates/freeplay-aa" }
freeplay-core = { path = "../../crates/freeplay-core" }
freeplay-id = { path = "../../crates/freeplay-id" }
freeplay-library = { path = "../../crates/freeplay-library" }
freeplay-session = { path = "../../crates/freeplay-session" }
freeplay-sync = { path = "../../crates/freeplay-sync" }
freeplay-table = { path = "../../crates/freeplay-table" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
toml = "0.9"
tracing.workspace = true
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
