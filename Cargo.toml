[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["antaresjay"]
repository = "https://github.com/antaresjay/freeplay"
rust-version = "1.82"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
