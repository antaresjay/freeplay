[package]
name = "freeplay-cli"
description = "Command line driver for Freeplay."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "freeplay"
path = "src/main.rs"

[dependencies]
toml = "0.9"
clap = { version = "4", features = ["derive"] }
freeplay-aa = { path = "../freeplay-aa" }
freeplay-core = { path = "../freeplay-core" }
freeplay-id = { path = "../freeplay-id" }
freeplay-library = { path = "../freeplay-library" }
freeplay-session = { path = "../freeplay-session" }
freeplay-sync = { path = "../freeplay-sync" }
freeplay-table = { path = "../freeplay-table" }
tracing.workspace = true
tracing-subscriber = "0.3"
freeplay-asm = { version = "0.1.1", path = "../freeplay-asm" }
